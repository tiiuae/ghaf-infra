name: Issue Source VSA

on:
  workflow_call:
    inputs:
      source-ref:
        description: Trusted source branch ref (for example refs/heads/main)
        required: true
        type: string

permissions: {}

jobs:
  source-vsa:
    name: Issue Source VSA
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: source-vsa-${{ github.repository }}-${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Resolve pinned issuer revision
        id: issuer
        shell: bash
        run: |
          # Read claims directly from GitHub's authenticated runner endpoint.
          claims=$(curl --fail --silent --show-error --get \
            --data-urlencode 'audience=sigstore' \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '
              .value | split(".")[1] | gsub("-"; "+") | gsub("_"; "/") | @base64d | fromjson
            ')
          sha=$(jq -er '.job_workflow_sha' <<< "$claims")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out trusted issuer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tiiuae/ghaf-infra
          ref: ${{ steps.issuer.outputs.sha }}
          path: issuer
          persist-credentials: false

      - name: Check out caller workflow policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          sparse-checkout: .github/workflows/source-vsa.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Issue Source VSA
        working-directory: issuer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_VSA_SOURCE_DIR: ${{ github.workspace }}/source
          SOURCE_VSA_ISSUER_SHA: ${{ steps.issuer.outputs.sha }}
          SOURCE_VSA_SOURCE_REF: ${{ inputs.source-ref }}
        run: nix run .#source-vsa -- issue
