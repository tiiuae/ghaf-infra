name: Update robot-framework flake input

on:
  schedule:
    # 06:00 EET (UTC+2)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-robot-framework:
    name: Update robot-framework input
    # Skip running in forked repositories; this job needs AUTOMATION_TOKEN.
    if: ${{ github.repository == 'tiiuae/ghaf-infra' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Only required for checkout; branch/PR writes use AUTOMATION_TOKEN.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086

      - name: Update robot-framework flake input
        shell: bash
        run: nix flake lock --update-input robot-framework

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-robot-framework
          add-paths: flake.lock
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: |
            flake.lock: Update robot-framework input

            Automated update of the robot-framework flake input.
          signoff: true
          title: "flake.lock: Update robot-framework input"
          body: |
            This PR updates the `robot-framework` flake input in `flake.lock`.
