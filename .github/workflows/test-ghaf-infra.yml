name: Build and test

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
  # Manual trigger. Lets maintainers run the workflow against any ref, which
  # is useful for exercising workflow changes before merge (e.g. via
  # `gh workflow run test-ghaf-infra.yml --ref <branch>`). GitHub only exposes
  # workflow_dispatch once the trigger exists on the default branch, so this
  # change itself must land on main before it can be used that way.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    # Important: 'authorize' must run before checkout to ensure 'authorize.yml'
    # runs the base version, not the untrusted version from the PR.
    uses: ./.github/workflows/authorize.yml
    # Skip running in forked repositories, since the workflow run would fail
    # due to missing repository secret(s):
    if: ${{ github.repository == 'tiiuae/ghaf-infra' }}
    with:
      github-org: tiiuae
    secrets:
      read-org-members: ${{ secrets.READ_ORG_MEMBERS }}
  build_matrix:
    name: "build (${{ matrix.arch }})"
    needs: [authorize]
    if: needs.authorize.outputs.result == 'authorized'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            builder: ${{ vars.BUILDER_X86 }}
            eval-max-memory-size: 4096
          - arch: aarch64-linux
            builder: ${{ vars.BUILDER_AARCH }}
            eval-max-memory-size: 2048
    concurrency:
      # Cancel any in-progress workflow runs from the same PR or branch,
      # allowing matrix jobs to run concurrently:
      group: ${{ github.workflow }}.${{ github.event.pull_request.number || github.ref }}.${{ matrix.arch }}
      cancel-in-progress: true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: |
            ${{ secrets.BUILDER_SSH_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Install nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - name: Add builders to ssh_known_hosts
        shell: bash
        run: |
          sudo sh -c "echo '${BUILDER_SSH_KNOWN_HOST}' >>/etc/ssh/ssh_known_hosts"
        env:
          BUILDER_SSH_KNOWN_HOST: '${{ vars.BUILDER_SSH_KNOWN_HOST }}'
      - name: Build ${{ matrix.arch }}
        shell: bash
        run: |
          export NIX_SSHOPTS="-o ControlMaster=no"
          # The builders are shared with Jenkins. Two evaluation workers keep
          # memory use down while reusing Nixpkgs across the targets in each worker.
          nix run --inputs-from .# nixpkgs#nix-fast-build -- \
            --flake ".#lib.ciBuilds.${{ matrix.arch }}" \
            --remote "${BUILDER:?Missing builder for this architecture}" \
            --remote-ssh-option ControlMaster no \
            --remote-ssh-option ConnectTimeout 30 \
            --max-jobs 2 --eval-workers 2 \
            --eval-max-memory-size "${{ matrix.eval-max-memory-size }}" \
            --no-nom --no-download --skip-cached \
            --option accept-flake-config true
        env:
          BUILDER: ${{ matrix.builder }}
