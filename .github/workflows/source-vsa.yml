name: Source VSA

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  source-vsa:
    name: Issue Source VSA
    uses: tiiuae/ghaf-infra/.github/workflows/issue-source-vsa.yml@main
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      source-ref: refs/heads/main
