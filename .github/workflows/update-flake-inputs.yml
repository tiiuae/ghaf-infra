name: Update flake inputs and Jenkins plugins

on:
  schedule:
    # 06:00 EET (UTC+2) every Monday
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-flake-inputs:
    name: Update flake inputs and Jenkins plugins
    # Skip running in forked repositories; this job needs AUTOMATION_TOKEN.
    if: ${{ github.repository == 'tiiuae/ghaf-infra' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Only required for checkout; branch/PR writes use AUTOMATION_TOKEN.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086

      # robot-framework has its own daily update PR, which would conflict.
      - name: Update flake inputs except robot-framework
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t inputs < <(nix flake metadata --json |
            jq -r '.locks.nodes.root.inputs | keys[] | select(. != "robot-framework")')
          nix flake update "${inputs[@]:?no flake inputs found}"

      - name: Update Jenkins plugins
        shell: bash
        run: |
          set -euo pipefail
          nix develop -c bash -lc '
            # Load shellHook-defined helpers (like update-jenkins-plugins) in this CI shell.
            source <(nix print-dev-env)
            update-jenkins-plugins modules/jenkins
          '

      - name: Configure git identity for commit hooks
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-flake-inputs
          add-paths: |
            flake.lock
            modules/jenkins/plugins.json
          committer: github-actions[bot] <github-actions@users.noreply.github.com>
          author: github-actions[bot] <github-actions@users.noreply.github.com>
          commit-message: |
            flake.lock: Update flake inputs and Jenkins plugins

            Automated update of flake inputs and Jenkins plugins.
          signoff: true
          title: "flake.lock: Update flake inputs and Jenkins plugins"
          body: |
            This PR updates every flake input other than `robot-framework` in `flake.lock`, and refreshes the Jenkins plugins manifest.
