# Runs the NixOS VM tests (flake outputs 'tests.<name>') on GitHub-hosted
# runners for changes that can affect them, including flake input updates.
# 'nix flake check' and the build workflow do not run them. Each test has its
# own job and its own paths below. Run the tests manually on any ref with:
#   gh workflow run vm-tests.yml --ref <branch>
# (GitHub offers manual runs once the workflow is on the default branch.)

name: VM tests

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/vm-tests.yml
      - flake.lock
      - flake.nix
      # scheduled-deployment
      - modules/monitoring.nix
      - modules/scheduled-deployment/**
      - tests/scheduled-deployment*.nix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Enables KVM on the runner by default (input 'enable_kvm').
      - name: Install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Run the scheduled-deployment VM test
        run: nix build -L .#tests.scheduled-deployment
