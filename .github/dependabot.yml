version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /pkgs/policy-checker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
